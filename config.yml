# RRD website editor settings.
backend:
  name: github
  repo: rrdjo/rrd-website
  branch: main
  base_url: https://api.netlify.com
site_url: https://www.rrdjo.com
display_url: https://www.rrdjo.com
logo_url: /favicon.png
media_folder: uploads
public_folder: uploads
editor:
  preview: false
collections:
- name: website
  label: Website
  editor:
    preview: false
  files:
  - name: site
    label: All website content (English and Arabic)
    file: site.json
    format: json
    fields:
    - name: hero
      label: Top of page
      widget: object
      fields:
      - name: eyebrow
        label: Small label
        widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: string
        - name: ar
          label: Arabic
          widget: string
          required: false
      - name: title
        label: Headline (first part)
        widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: string
        - name: ar
          label: Arabic
          widget: string
          required: false
      - name: highlight
        label: Headline (coloured part)
        widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: string
        - name: ar
          label: Arabic
          widget: string
          required: false
      - name: intro
