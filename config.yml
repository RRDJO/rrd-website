          label: Tags
          widget: list
          required: false
          summary: '{{fields.en}}'
          fields:
          - name: en
            label: English
            widget: string
          - name: ar
            label: Arabic
            widget: string
            required: false
        - name: icon
          label: Icon (used when there is no photo)
          widget: select
          default: milking
          options:
          - milking
          - cooling
          - herd
          - hygiene
          - comfort
          - feeding
        - name: image
          label: Photo (optional)
          widget: image
          required: false
          choose_url: false
        - &id001
          name: image_fit
          label: Photo fit
          widget: select
          default: cover
          options:
          - label: Fill the frame (crop edges)
            value: cover
          - label: Show the whole photo (for product shots on white)
            value: contain
